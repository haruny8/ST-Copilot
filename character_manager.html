<div id="scp-char-overlay" class="scp-char-overlay" style="display:none">
    <div class="scp-char-panel">
        <div class="scp-char-header">
            <div class="scp-char-header-left">
                <span class="scp-char-title-icon">${I.user}</span>
                <span class="scp-char-title">Character Manager</span>
            </div>
            <div class="scp-char-header-right">
                <button class="scp-hbtn scp-hbtn-close" id="scp-char-close" title="Close">${I.x}</button>
            </div>
        </div>
        <div class="scp-char-body">
            <div class="scp-char-sidebar">
                <div class="scp-char-sidebar-header">Active Character</div>
                <div class="scp-char-list" id="scp-char-list">
                    <div class="scp-lb-loading">Loading...</div>
                </div>
            </div>
            <div class="scp-char-main" id="scp-char-main">
                <div class="scp-char-empty-state">
                    <div class="scp-empty-icon">${I.user}</div>
                    <div>Select an entry to view details</div>
                </div>
            </div>
        </div>
    </div>
</div>
